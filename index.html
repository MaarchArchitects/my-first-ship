<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lizie | Maarch Architects</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif;
    background: #000000;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  .card {
    background: #ffffff;
    max-width: 440px;
    width: 100%;
    padding: 56px 44px;
    text-align: center;
    border: 1px solid #e5e5e5;
  }

  .logo {
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 4px;
    color: #000000;
    margin-bottom: 40px;
  }

  .logo span {
    font-weight: 300;
    letter-spacing: 4px;
  }

  .avatar {
    width: 88px;
    height: 88px;
    border-radius: 50%;
    background: #000000;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-size: 30px;
    font-weight: 500;
    letter-spacing: 1px;
    margin: 0 auto 28px;
  }

  h1 {
    font-size: 26px;
    font-weight: 600;
    color: #000000;
    letter-spacing: 0.5px;
    margin-bottom: 6px;
  }

  .role {
    color: #000000;
    font-weight: 400;
    font-size: 14px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    margin-bottom: 4px;
  }

  .company {
    color: #737373;
    font-size: 13px;
    letter-spacing: 1px;
    margin-bottom: 28px;
  }

  .divider {
    height: 1px;
    background: #000000;
    width: 40px;
    margin: 0 auto 28px;
  }

  .description {
    color: #404040;
    font-size: 15px;
    line-height: 1.7;
    margin-bottom: 32px;
  }

  .tags {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: center;
    margin-bottom: 32px;
  }

  .tag {
    border: 1px solid #000000;
    color: #000000;
    padding: 6px 14px;
    font-size: 12px;
    letter-spacing: 0.5px;
    text-transform: uppercase;
  }

  .contact {
    display: inline-block;
    background: #000000;
    color: #ffffff;
    border: 1px solid #000000;
    padding: 13px 32px;
    font-size: 13px;
    font-weight: 500;
    letter-spacing: 1px;
    text-transform: uppercase;
    text-decoration: none;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="logo">MA<span>ARCH</span></div>

    <div class="avatar">LP</div>
    <h1>Lizie P.</h1>
    <div class="role">Office Manager</div>
    <div class="company">MAARCH ARCHITECTS</div>

    <div class="divider"></div>

    <p class="description">
      I look after administration and documentation for the team, along with
      some finance and accounting. Reach out any time you need something
      organised, tracked down, or sorted.
    </p>

    <div class="tags">
      <span class="tag">Administration</span>
      <span class="tag">Documentation</span>
      <span class="tag">Finance</span>
      <span class="tag">Accounting</span>
    </div>

    <a href="mailto:info@maarch.net.au" class="contact">info@maarch.net.au</a>
  </div>
</body>
</html>
