<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lizie | Maarch Architects</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
    background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }

  .card {
    background: #ffffff;
    border-radius: 20px;
    max-width: 420px;
    width: 100%;
    padding: 48px 40px;
    box-shadow: 0 25px 60px rgba(0,0,0,0.35);
    text-align: center;
  }

  .avatar {
    width: 84px;
    height: 84px;
    border-radius: 50%;
    background: linear-gradient(135deg, #2563eb, #7c3aed);
    display: flex;
    align-items: center;
    justify-content: center;
    color: #fff;
    font-size: 32px;
    font-weight: 700;
    margin: 0 auto 24px;
  }

  h1 {
    font-size: 26px;
    color: #0f172a;
    margin-bottom: 4px;
  }

  .role {
    color: #2563eb;
    font-weight: 600;
    font-size: 15px;
    margin-bottom: 20px;
  }

  .company {
    color: #64748b;
    font-size: 14px;
    margin-bottom: 24px;
    letter-spacing: 0.3px;
  }

  .divider {
    height: 1px;
    background: #e2e8f0;
    margin: 24px 0;
  }

  .description {
    color: #334155;
    font-size: 15px;
    line-height: 1.6;
    margin-bottom: 28px;
  }

  .tags {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    justify-content: center;
    margin-bottom: 28px;
  }

  .tag {
    background: #eff6ff;
    color: #2563eb;
    padding: 6px 14px;
    border-radius: 999px;
    font-size: 13px;
    font-weight: 500;
  }

  .contact {
    background: #0f172a;
    color: #fff;
    border: none;
    padding: 12px 28px;
    border-radius: 10px;
    font-size: 14px;
    font-weight: 600;
    cursor: default;
  }
</style>
</head>
<body>
  <div class="card">
    <div class="avatar">L</div>
    <h1>Lizie</h1>
    <div class="role">Office Manager</div>
    <div class="company">MAARCH ARCHITECTS</div>

    <div class="divider"></div>

    <p class="description">
      I look after administration and documentation for the team, along with
      some finance and accounting. Reach out any time you need something
      organised, tracked down, or sorted.
    </p>

    <div class="tags">
      <span class="tag">Administration</span>
      <span class="tag">Documentation</span>
      <span class="tag">Finance</span>
      <span class="tag">Accounting</span>
    </div>

    <button class="contact">Get in touch</button>
  </div>
</body>
</html>
